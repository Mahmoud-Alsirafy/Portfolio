<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="medBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50" />
      <stop offset="100%" stop-color="#1a252f" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E1F4F3" />
      <stop offset="100%" stop-color="#a4deda" />
    </linearGradient>
  </defs>
  <!-- Screen Background -->
  <rect width="600" height="380" rx="16" fill="url(#medBg)" />
  <!-- Browser Header Bar -->
  <rect width="600" height="40" rx="16" fill="#243342" />
  <rect y="25" width="600" height="15" fill="#243342" />
  <circle cx="28" cy="20" r="6" fill="#e74c3c" />
  <circle cx="48" cy="20" r="6" fill="#f39c12" />
  <circle cx="68" cy="20" r="6" fill="#2ecc71" />
  <rect x="150" y="10" width="300" height="20" rx="6" fill="#1b2631" />
  <text x="300" y="24" fill="#E1F4F3" font-family="monospace, sans-serif" font-size="11" text-anchor="middle" opacity="0.85">https://medlink.health/portal</text>

  <!-- Sidebar -->
  <rect x="20" y="55" width="110" height="305" rx="8" fill="#1e2b37" />
  <rect x="35" y="75" width="80" height="12" rx="4" fill="#E1F4F3" opacity="0.8" />
  <rect x="35" y="105" width="60" height="8" rx="3" fill="#706C61" />
  <rect x="35" y="125" width="70" height="8" rx="3" fill="#706C61" />
  <rect x="35" y="145" width="55" height="8" rx="3" fill="#706C61" />
  <rect x="35" y="165" width="65" height="8" rx="3" fill="#706C61" />

  <!-- Main Content Area -->
  <!-- Header Card -->
  <rect x="145" y="55" width="435" height="70" rx="10" fill="#22313f" stroke="#2c3e50" stroke-width="1.5" />
  <circle cx="180" cy="90" r="20" fill="url(#tealGrad)" />
  <!-- Medical Cross -->
  <path d="M176 80 h8 v6 h6 v8 h-6 v6 h-8 v-6 h-6 v-8 h6 z" fill="#333333" />
  <text x="215" y="85" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">MedLink EHR &amp; Clinical System</text>
  <text x="215" y="105" fill="#a4deda" font-family="system-ui, sans-serif" font-size="11">Role-Based Medical Access (Doctor / Patient / Admin)</text>

  <!-- Stats Grid -->
  <rect x="145" y="140" width="135" height="80" rx="8" fill="#22313f" />
  <text x="160" y="168" fill="#706C61" font-family="system-ui, sans-serif" font-size="11">Patient Records</text>
  <text x="160" y="198" fill="#E1F4F3" font-family="monospace, sans-serif" font-size="20" font-weight="bold">1,420+</text>

  <rect x="295" y="140" width="135" height="80" rx="8" fill="#22313f" />
  <text x="310" y="168" fill="#706C61" font-family="system-ui, sans-serif" font-size="11">Lab Reports</text>
  <text x="310" y="198" fill="#E1F4F3" font-family="monospace, sans-serif" font-size="20" font-weight="bold">3,890</text>

  <rect x="445" y="140" width="135" height="80" rx="8" fill="#22313f" />
  <text x="460" y="168" fill="#706C61" font-family="system-ui, sans-serif" font-size="11">API Uptime</text>
  <text x="460" y="198" fill="#2ecc71" font-family="monospace, sans-serif" font-size="20" font-weight="bold">99.8%</text>

  <!-- Clinical Chart / ECG waveform -->
  <rect x="145" y="235" width="435" height="125" rx="10" fill="#22313f" />
  <path d="M165 300 L 210 300 L 225 260 L 240 330 L 255 285 L 270 300 L 330 300 L 345 255 L 360 335 L 375 280 L 390 300 L 460 300 L 475 260 L 490 330 L 505 285 L 520 300 L 560 300" fill="none" stroke="#E1F4F3" stroke-width="2.5" stroke-linecap="round" />
</svg>
