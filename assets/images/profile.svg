<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E1F4F3" />
      <stop offset="100%" stop-color="#cdeceb" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#333333" />
      <stop offset="100%" stop-color="#4a4947" />
    </linearGradient>
  </defs>
  <!-- Background Circle / Frame -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="170" fill="#FFFFFF" stroke="#E1F4F3" stroke-width="6"/>
  
  <!-- Stylized Geometric Developer Silhouette -->
  <g transform="translate(0, 20)">
    <!-- Shoulders / Torso -->
    <path d="M120 330 C120 270, 150 250, 200 250 C250 250, 280 270, 280 330 Z" fill="url(#avatarGrad)" />
    <!-- Collar / Shirt Detail -->
    <path d="M185 250 L200 280 L215 250 Z" fill="#E1F4F3" />
    <!-- Neck -->
    <rect x="185" y="210" width="30" height="45" rx="5" fill="#e8dacb" />
    <!-- Head -->
    <circle cx="200" cy="165" r="55" fill="#f2e3d5" />
    <!-- Hair -->
    <path d="M145 160 C145 110, 175 105, 200 105 C225 105, 255 110, 255 160 C250 140, 230 125, 200 125 C170 125, 150 140, 145 160 Z" fill="#333333" />
    <!-- Glasses -->
    <rect x="165" y="155" width="28" height="18" rx="4" fill="none" stroke="#333333" stroke-width="3" />
    <rect x="207" y="155" width="28" height="18" rx="4" fill="none" stroke="#333333" stroke-width="3" />
    <line x1="193" y1="164" x2="207" y2="164" stroke="#333333" stroke-width="3" />
    <path d="M165 164 L152 160" stroke="#333333" stroke-width="3" stroke-linecap="round" />
    <path d="M235 164 L248 160" stroke="#333333" stroke-width="3" stroke-linecap="round" />
    <!-- Smile & Beard -->
    <path d="M192 195 Q200 202 208 195" fill="none" stroke="#706C61" stroke-width="2.5" stroke-linecap="round" />
    <path d="M180 185 C180 215, 220 215, 220 185" fill="none" stroke="#333333" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 3" />
  </g>

  <!-- Developer Code Tag Badge -->
  <g transform="translate(130, 320)">
    <rect width="140" height="34" rx="17" fill="#333333" />
    <text x="70" y="22" fill="#E1F4F3" font-family="monospace, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">&lt;MW / Dev&gt;</text>
  </g>
</svg>
